[platformio]
src_dir = Core/Src
include_dir = Core/Inc

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
; Đề Khó K03: nền STM32CubeIDE + HAL (quy định chung mục 2).
; KHÔNG dùng framework=arduino nữa (Arduino core che thanh ghi -> rớt Khó).
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
; Telemetry + lệnh REF/SEQ giờ qua USART1 PA9/PA10 -> CH340 USB-UART (không còn USB-CDC)
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
build_flags =
  -Wl,-u,_printf_float
  -Os
  -Wall
